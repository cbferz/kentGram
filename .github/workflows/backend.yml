name: kentGram Backend CI

on:
  push:
    branches:
      - '**'
    paths:
      - 'server/**'
      - '.github/workflows/backend.yml'
  pull_request:
    branches:
      - '**'
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'server/**'
      - '.github/workflows/backend.yml'
  workflow_dispatch:

concurrency:
  group: kentgram-backend-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Go tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: kentgram
          POSTGRES_PASSWORD: kentgram_ci_only
          POSTGRES_DB: kentgram_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kentgram -d kentgram_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    env:
      TEST_DATABASE_URL: postgres://kentgram:kentgram_ci_only@localhost:5432/kentgram_test?sslmode=disable
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go and restore module/build cache
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: true
          cache-dependency-path: server/go.mod

      - name: Download Go modules
        working-directory: server
        run: go mod download

      - name: Check Go formatting
        working-directory: server
        shell: bash
        run: |
          files="$(gofmt -l $(find ./cmd ./internal -name '*.go' -type f))"
          if [[ -n "$files" ]]; then
            echo "These Go files need gofmt:"
            echo "$files"
            exit 1
          fi

      - name: Run go vet
        working-directory: server
        run: go vet ./...

      - name: Run tests with race detector
        working-directory: server
        run: go test -race -count=1 ./...

      - name: Build API server
        working-directory: server
        run: CGO_ENABLED=0 go build -trimpath -o "$RUNNER_TEMP/kentgram-api" ./cmd/api
