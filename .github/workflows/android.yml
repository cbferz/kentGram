name: Android build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: kentgram-android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KENTGRAM_KEYSTORE_BASE64: ${{ secrets.KENTGRAM_KEYSTORE_BASE64 }}
      KENTGRAM_KEYSTORE_PASSWORD: ${{ secrets.KENTGRAM_KEYSTORE_PASSWORD }}
      KENTGRAM_KEY_ALIAS: ${{ secrets.KENTGRAM_KEY_ALIAS }}
      KENTGRAM_KEY_PASSWORD: ${{ secrets.KENTGRAM_KEY_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Prepare persistent signing key
        id: signing
        shell: bash
        run: |
          if [[ -z "$KENTGRAM_KEYSTORE_BASE64" || -z "$KENTGRAM_KEYSTORE_PASSWORD" || -z "$KENTGRAM_KEY_ALIAS" || -z "$KENTGRAM_KEY_PASSWORD" ]]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "Persistent signing is not configured. APK will be built for CI validation only and will not be published as an update."
            exit 0
          fi
          mkdir -p "$RUNNER_TEMP/kentgram-signing"
          printf '%s' "$KENTGRAM_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/kentgram-signing/kentgram-upload.jks"
          test -s "$RUNNER_TEMP/kentgram-signing/kentgram-upload.jks"
          echo "KENTGRAM_KEYSTORE_PATH=$RUNNER_TEMP/kentgram-signing/kentgram-upload.jks" >> "$GITHUB_ENV"
          echo "configured=true" >> "$GITHUB_OUTPUT"

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Verify APK signature
        if: steps.signing.outputs.configured == 'true'
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: kentgram-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
          if-no-files-found: error

      - name: Publish signed APK as prerelease
        if: steps.signing.outputs.configured == 'true' && ((github.ref == 'refs/heads/main' && github.event_name != 'pull_request') || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository))
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk kentgram-debug.apk
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            RELEASE_TAG="kentgram-redesign-pr${{ github.event.pull_request.number }}"
            RELEASE_TITLE="kentGram redesign PR #${{ github.event.pull_request.number }}"
          else
            RELEASE_TAG="debug-latest"
            RELEASE_TITLE="kentGram update (${GITHUB_SHA::7})"
          fi
          gh release delete "$RELEASE_TAG" --cleanup-tag --yes || true
          gh release create "$RELEASE_TAG" kentgram-debug.apk \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "$RELEASE_TITLE" \
            --notes "Persistent-key signed kentGram APK. versionCode is derived from GitHub Actions run number."
