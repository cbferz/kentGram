name: kentGram Android CI

on:
  push:
    branches:
      - '**'
    paths:
      - 'app/**'
      - 'gradle/**'
      - 'gradlew'
      - '**/*.gradle'
      - '**/*.gradle.kts'
      - 'gradle.properties'
      - 'settings.gradle.kts'
      - '.github/workflows/android.yml'
  pull_request:
    branches:
      - '**'
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'app/**'
      - 'gradle/**'
      - 'gradlew'
      - '**/*.gradle'
      - '**/*.gradle.kts'
      - 'gradle.properties'
      - 'settings.gradle.kts'
      - '.github/workflows/android.yml'
  workflow_dispatch:

concurrency:
  group: kentgram-android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  android:
    name: Build Android APK
    # Runs on ubuntu-latest currently fail before a runner is assigned; the
    # persistent VPS runner works. Everything below is tuned for a runner
    # that keeps its home directory between jobs: ~/.gradle (dependencies,
    # Gradle distribution, build cache) and the Android SDK are reused in
    # place instead of being uploaded to and restored from the GitHub cache,
    # which is far slower from the VPS than rebuilding.
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 30
    env:
      KENTGRAM_KEYSTORE_BASE64: ${{ secrets.KENTGRAM_KEYSTORE_BASE64 }}
      KENTGRAM_KEYSTORE_PASSWORD: ${{ secrets.KENTGRAM_KEYSTORE_PASSWORD }}
      KENTGRAM_KEY_ALIAS: ${{ secrets.KENTGRAM_KEY_ALIAS }}
      KENTGRAM_KEY_PASSWORD: ${{ secrets.KENTGRAM_KEY_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure existing Android SDK
        shell: bash
        run: |
          set -Eeuo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-$HOME/.android/sdk}}"
          test -d "$SDK_ROOT/cmdline-tools"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          test -n "$SDKMANAGER" && test -x "$SDKMANAGER"
          {
            echo "ANDROID_HOME=$SDK_ROOT"
            echo "ANDROID_SDK_ROOT=$SDK_ROOT"
            echo "SDKMANAGER=$SDKMANAGER"
          } >> "$GITHUB_ENV"
          echo "Android SDK: $SDK_ROOT"

      - name: Install only missing Android SDK components
        shell: bash
        run: |
          set -Eeuo pipefail
          # No NDK or CMake: the app has no native code any more.
          packages=(
            'platform-tools'
            'platforms;android-35'
            'build-tools;35.0.0'
          )
          missing=()
          for package in "${packages[@]}"; do
            dir="$ANDROID_HOME/${package//;//}"
            [[ -d "$dir" ]] || missing+=("$package")
          done
          if (( ${#missing[@]} > 0 )); then
            yes | "$SDKMANAGER" --licenses >/dev/null || true
            "$SDKMANAGER" --install "${missing[@]}"
          else
            echo "All required Android SDK components are already installed."
          fi

      - name: Prepare persistent signing key
        id: signing
        shell: bash
        run: |
          if [[ -z "$KENTGRAM_KEYSTORE_BASE64" || -z "$KENTGRAM_KEYSTORE_PASSWORD" || -z "$KENTGRAM_KEY_ALIAS" || -z "$KENTGRAM_KEY_PASSWORD" ]]; then
            echo 'configured=false' >> "$GITHUB_OUTPUT"
            echo 'Signing secrets unavailable; producing an unsigned CI APK.'
            exit 0
          fi
          mkdir -p "$RUNNER_TEMP/kentgram-signing"
          printf '%s' "$KENTGRAM_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/kentgram-signing/kentgram-upload.jks"
          test -s "$RUNNER_TEMP/kentgram-signing/kentgram-upload.jks"
          echo "KENTGRAM_KEYSTORE_PATH=$RUNNER_TEMP/kentgram-signing/kentgram-upload.jks" >> "$GITHUB_ENV"
          echo 'configured=true' >> "$GITHUB_OUTPUT"

      - name: Build debug APK
        shell: bash
        # The wrapper keeps Gradle 8.9 in ~/.gradle/wrapper instead of downloading
        # it every run; ~/.gradle also holds dependencies and the build cache
        # (org.gradle.caching=true), so unchanged tasks come FROM-CACHE.
        # Gradle prunes entries unused for 7 (build cache) / 30 days by itself.
        run: ./gradlew --console=plain assembleDebug

      - name: Verify APK signature
        if: steps.signing.outputs.configured == 'true'
        shell: bash
        run: |
          APK='app/build/outputs/apk/debug/app-debug.apk'
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"

      - name: Write build metadata
        shell: bash
        run: |
          {
            echo "commit=$GITHUB_SHA"
            echo "branch=$GITHUB_REF_NAME"
            echo "run_id=$GITHUB_RUN_ID"
            echo "run_number=$GITHUB_RUN_NUMBER"
            echo "signed=${{ steps.signing.outputs.configured }}"
          } > app/build/outputs/apk/debug/build-info.txt

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: kentgram-apk-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/debug/build-info.txt
          if-no-files-found: error
          retention-days: 14
          # The APK is already compressed; zipping it again only costs time.
          compression-level: 0
