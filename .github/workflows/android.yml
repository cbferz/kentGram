name: kentGram Android CI

on:
  push:
    branches:
      - '**'
    paths:
      - 'app/**'
      - 'gradle/**'
      - '**/*.gradle'
      - '**/*.gradle.kts'
      - 'gradle.properties'
      - 'settings.gradle.kts'
      - '.github/workflows/android.yml'
  pull_request:
    branches:
      - '**'
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'app/**'
      - 'gradle/**'
      - '**/*.gradle'
      - '**/*.gradle.kts'
      - 'gradle.properties'
      - 'settings.gradle.kts'
      - '.github/workflows/android.yml'
  workflow_dispatch:

concurrency:
  group: kentgram-android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  android:
    name: Build Android APK
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 60
    env:
      KENTGRAM_KEYSTORE_BASE64: ${{ secrets.KENTGRAM_KEYSTORE_BASE64 }}
      KENTGRAM_KEYSTORE_PASSWORD: ${{ secrets.KENTGRAM_KEYSTORE_PASSWORD }}
      KENTGRAM_KEY_ALIAS: ${{ secrets.KENTGRAM_KEY_ALIAS }}
      KENTGRAM_KEY_PASSWORD: ${{ secrets.KENTGRAM_KEY_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install only missing Android SDK components
        shell: bash
        run: |
          set -Eeuo pipefail
          packages=(
            'platform-tools'
            'platforms;android-35'
            'build-tools;35.0.0'
            'cmake;3.22.1'
            'ndk;27.0.12077973'
          )
          installed="$(sdkmanager --list_installed 2>/dev/null || true)"
          missing=()
          for package in "${packages[@]}"; do
            if ! grep -Fq "$package" <<< "$installed"; then
              missing+=("$package")
            fi
          done
          if (( ${#missing[@]} > 0 )); then
            yes | sdkmanager --licenses >/dev/null
            sdkmanager "${missing[@]}"
          else
            echo "All required Android SDK components are already installed."
          fi

      - name: Restore Gradle configuration cache
        uses: actions/cache@v4
        with:
          path: .gradle/configuration-cache
          key: kentgram-config-${{ runner.os }}-${{ hashFiles('**/*.gradle', '**/*.gradle.kts', 'gradle.properties') }}-${{ github.sha }}
          restore-keys: |
            kentgram-config-${{ runner.os }}-${{ hashFiles('**/*.gradle', '**/*.gradle.kts', 'gradle.properties') }}-

      - name: Set up Gradle and restore dependency/build cache
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
          gradle-home-cache-includes: |
            caches/build-cache-1

      - name: Prepare persistent signing key
        id: signing
        shell: bash
        run: |
          if [[ -z "$KENTGRAM_KEYSTORE_BASE64" || -z "$KENTGRAM_KEYSTORE_PASSWORD" || -z "$KENTGRAM_KEY_ALIAS" || -z "$KENTGRAM_KEY_PASSWORD" ]]; then
            echo 'configured=false' >> "$GITHUB_OUTPUT"
            echo 'Signing secrets unavailable; producing an unsigned CI APK.'
            exit 0
          fi
          mkdir -p "$RUNNER_TEMP/kentgram-signing"
          printf '%s' "$KENTGRAM_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/kentgram-signing/kentgram-upload.jks"
          test -s "$RUNNER_TEMP/kentgram-signing/kentgram-upload.jks"
          echo "KENTGRAM_KEYSTORE_PATH=$RUNNER_TEMP/kentgram-signing/kentgram-upload.jks" >> "$GITHUB_ENV"
          echo 'configured=true' >> "$GITHUB_OUTPUT"

      - name: Build debug APK
        run: gradle --build-cache --configuration-cache --configuration-cache-problems=warn assembleDebug

      - name: Verify APK signature
        if: steps.signing.outputs.configured == 'true'
        shell: bash
        run: |
          APK='app/build/outputs/apk/debug/app-debug.apk'
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$APKSIGNER"
          "$APKSIGNER" verify --verbose "$APK"

      - name: Write build metadata
        shell: bash
        run: |
          {
            echo "commit=$GITHUB_SHA"
            echo "branch=$GITHUB_REF_NAME"
            echo "run_id=$GITHUB_RUN_ID"
            echo "run_number=$GITHUB_RUN_NUMBER"
            echo "signed=${{ steps.signing.outputs.configured }}"
          } > app/build/outputs/apk/debug/build-info.txt

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: kentgram-apk-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/debug/build-info.txt
          if-no-files-found: error
          retention-days: 14
