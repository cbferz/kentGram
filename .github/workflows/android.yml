name: Android build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Only the newest commit on a branch may publish the rolling APK release.
concurrency:
  group: kentgram-android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # GitHub-hosted Ubuntu runners already include the Android SDK.
      # Avoid setup-android's obsolete "tools" package installation.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      # Actions artifact storage is an account-wide quota and can be exhausted
      # by unrelated repositories, which must not turn a successful build red.
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: kentgram-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
          if-no-files-found: error

      # Release assets do not consume Actions artifact storage. Publish main
      # to its existing rolling tag and same-repository PR builds to an isolated
      # PR tag, leaving the main download untouched.
      - name: Publish APK as prerelease
        if: (github.ref == 'refs/heads/main' && github.event_name != 'pull_request') || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk kentgram-debug.apk
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            RELEASE_TAG="kentgram-redesign-pr${{ github.event.pull_request.number }}"
            RELEASE_TITLE="kentGram redesign PR #${{ github.event.pull_request.number }}"
          else
            RELEASE_TAG="debug-latest"
            RELEASE_TITLE="Debug APK (${GITHUB_SHA::7})"
          fi
          gh release delete "$RELEASE_TAG" --cleanup-tag --yes || true
          gh release create "$RELEASE_TAG" kentgram-debug.apk \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "$RELEASE_TITLE" \
            --notes "Automated debug build of commit $GITHUB_SHA. Debug-signed, not for production distribution."
