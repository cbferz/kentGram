services:
  api:
    build:
      context: ./server
    restart: unless-stopped
    environment:
      PORT: "8080"
      DATABASE_URL: postgres://${POSTGRES_USER:-kentgram}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-kentgram}?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      AVATAR_DIR: /data/avatars
      PUBLIC_BASE_URL: https://api.kentgram.tendercheck.pro
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - kentgram_media:/data
    mem_limit: 512m

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-kentgram}
      POSTGRES_USER: ${POSTGRES_USER:-kentgram}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kentgram} -d ${POSTGRES_DB:-kentgram}"]
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 1g

volumes:
  postgres_data:
  kentgram_media:
